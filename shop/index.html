<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Магазин Фаровон</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday shopping app, looks like a shipped product
   IDEA a store shelf that only shows what is on this point's shelf today
   PICTURE the product grid itself, with the chosen point as a bold header bar
   COLOUR white ground, ink, Farovon logo green #1f9a3a for header and actions, soft greys
   TYPE Golos Text (built for Cyrillic) for everything, weights for hierarchy
   LAYOUT phone-first single column; at 720px+ grid widens to 3–4 columns, sheets stay centred */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121316);--ink:light-dark(#16181d,#eef0f4);--mut:light-dark(#6b7280,#9aa1ad);--surf:light-dark(#f3f4f6,#1d1f24);--line:light-dark(#e6e8ec,#2a2d33);--acc:light-dark(#1f9a3a,#2fb24c);--acc-ink:#fff;--ok:light-dark(#18864b,#4cc785);--ok-bg:light-dark(#e7f6ee,#173324);--warn:light-dark(#a35b00,#f0b45a);--warn-bg:light-dark(#fff3e0,#3a2a12)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;height:40px;margin-bottom:10px}
.brand img{height:30px;width:auto;max-width:180px;object-fit:contain}
.wordmark{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--acc)}
.brand small{margin-left:auto;font-size:13px;color:var(--mut);white-space:nowrap}
.pointbtn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:var(--acc);color:var(--acc-ink);border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer}
.pointbtn svg{flex:none;width:26px;height:26px}
.pointbtn b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pointbtn small{display:block;font-size:13px;opacity:.92}
.pointbtn .chev{margin-left:auto;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 10px;white-space:nowrap}
.search{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:12px 14px;font-size:16px}
.srow{display:flex;gap:8px;margin-top:10px}
.srow .search{margin-top:0;flex:1}
.mybtn{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:13px}
.mini{position:relative;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.cat[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{color:var(--mut);font-size:13px;margin:12px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:880px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surf);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pic{aspect-ratio:5/3;border-radius:13px;position:relative}
.pic svg{position:absolute;left:30%;top:12%;width:40%;height:76%}
.price{font-size:18px;font-weight:800;white-space:nowrap}
.name{font-size:14px;line-height:1.3;font-weight:500}
.unit{font-size:13px;color:var(--mut)}
.left{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:2px 6px;align-self:flex-start}
.add{margin-top:auto;border:0;background:var(--bg);border-radius:12px;height:42px;font-weight:700;cursor:pointer;font-size:15px}
.add:hover{background:var(--acc);color:var(--acc-ink)}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--acc);color:var(--acc-ink);border-radius:12px;height:42px}
.step button{border:0;background:none;color:inherit;width:44px;height:42px;font-size:22px;font-weight:700;cursor:pointer}
.step span{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cartbar button{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:968px;margin:0 auto;border:0;background:var(--acc);color:var(--acc-ink);border-radius:16px;padding:16px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(31,154,58,.3)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:22px;line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
.pt{display:flex;gap:12px;align-items:flex-start;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:8px;text-align:left;cursor:pointer}
.pt[aria-current=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pt b{display:block;font-weight:700}
.pt small{display:block;color:var(--mut);font-size:13px}
.pt .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;background:var(--surf);color:var(--mut)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .mini{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center}
.line .mini svg{width:60%;height:70%}
.line .nm{flex:1;font-size:14px}
.line .nm small{display:block;color:var(--mut)}
.qty{display:flex;align-items:center;background:var(--surf);border-radius:10px}
.qty button{border:0;background:none;width:36px;height:36px;font-size:18px;font-weight:700;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surf);border-radius:14px;padding:4px;margin:16px 0 4px}
.seg button{border:0;background:none;border-radius:11px;padding:11px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--mut);margin:4px 2px 10px}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;font-size:16px}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{flex:1;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;font-size:15px;min-width:9.5em}
.radio input{accent-color:var(--acc)}
.sum{margin-top:16px;background:var(--surf);border-radius:14px;padding:12px 14px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.sum div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.warn{color:var(--warn);font-size:14px;margin-top:8px}
.big{width:100%;margin-top:16px;border:0;background:var(--acc);color:var(--acc-ink);border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer}
.big:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:var(--surf);color:var(--ink)}
.track{margin:14px 0 4px}
.track div{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--mut)}
.track i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.track .on{color:var(--ink);font-weight:600}
.track .on i{background:var(--acc);border-color:var(--acc);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:90px;z-index:60;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 16px;font-weight:600;font-size:15px;transition:opacity .2s}
.toast.off{opacity:0;pointer-events:none}
.demo{font-size:12px;color:var(--mut);text-align:center;margin-top:24px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>

let CATS = [], PRODUCTS = [], POINTS = [], STOCK = {};
let pointId = store.get('point', null);
let cart = store.get('cart', {});
let cat = 'all', query = '', loading = true, busy = false;
let checkout = { method: 'pickup', addr: '', phone: '', slot: 'Как можно скорее', pay: 'cash', comment: '' };
let lastOrder = null, orderTimer = null, client = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Math.round(n).toLocaleString('ru-RU') + ' с.';
const point = () => POINTS.find(p => p.id === pointId) || null;
const stock = id => { const v = STOCK[id]; return v === undefined ? 0 : v < 0 ? 99 : v; };
const limited = id => STOCK[id] !== undefined && STOCK[id] >= 0;
const catIdx = id => Math.max(0, CATS.findIndex(c => c.id === id));
const pic = (p, cls) => {
  if (p.photo) return '<div class="' + cls + '"><img src="' + esc(p.photo) + '" alt="" loading="lazy"></div>';
  const ic = ICONS[catIdx(p.cat) % ICONS.length];
  return '<div class="' + cls + '" style="background:' + ic[1] + '"><svg aria-hidden="true"><use href="#' + ic[0] + '"/></svg></div>';
};
function haptic(t) { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} }
let tt;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('off'); clearTimeout(tt); tt = setTimeout(() => el.classList.add('off'), 3800); }
function save() { store.set('point', pointId); store.set('cart', cart); }

async function api(action, data) {
  const res = await fetch(API_URL, { method: 'POST',
    body: JSON.stringify(Object.assign({ action: action, initData: tg ? tg.initData : '' }, data || {})) });
  return res.json();
}

// ---------- Загрузка ----------
async function boot() {
  render();
  if (!LIVE) {
    CATS = DEMO.cats; PRODUCTS = DEMO.products; POINTS = DEMO.points;
  } else {
    try {
      const r = await api('init', pointId ? { point: pointId } : {});
      if (!r.ok) throw new Error(r.message);
      CATS = r.cats; PRODUCTS = r.products; POINTS = r.points; client = r.client;
      if (r.stock) STOCK = r.stock;
      if (client) { checkout.phone = client.phone || ''; checkout.addr = client.address || ''; }
    } catch (e) {
      loading = false;
      $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">Нет связи с магазином. Проверьте интернет и откройте снова.</div>';
      return;
    }
  }
  if (!POINTS.some(p => p.id === pointId)) pointId = null;
  if (pointId && !LIVE) STOCK = DEMO.stock(pointId);
  loading = false;
  cleanCart();
  render();
  if (!pointId) openPoints();
}

// ---------- Каталог ----------
function renderHeader() {
  const p = point();
  $('pointName').textContent = p ? p.name : 'Выберите точку';
  $('pointSub').textContent = p ? (p.delivery ? 'Доставка ' + p.delivery.eta + ' · самовывоз' : 'Только самовывоз') + (p.hours ? ' · ' + p.hours : '')
    : 'Покажем товары, которые есть на ней сейчас';
  $('cats').innerHTML = [{ id: 'all', name: 'Все' }].concat(CATS).map(c =>
    '<button class="cat" data-c="' + esc(c.id) + '" aria-pressed="' + (cat === c.id) + '">' + esc(c.name) + '</button>').join('');
}

function renderGrid() {
  const g = $('grid');
  if (loading) { g.innerHTML = '<div class="empty" style="grid-column:1/-1">Загрузка…</div>'; $('note').textContent = ''; return; }
  if (!pointId) { g.innerHTML = '<div class="empty" style="grid-column:1/-1">Выберите точку, чтобы увидеть товары в наличии</div>'; $('note').textContent = ''; return; }
  const avail = PRODUCTS.filter(p => stock(p.id) > 0);
  const q = query.trim().toLowerCase();
  const list = avail.filter(p => (cat === 'all' || p.cat === cat) && (!q || p.name.toLowerCase().includes(q)));
  $('note').textContent = 'В наличии на этой точке ' + avail.length + ' из ' + PRODUCTS.length + ' товаров каталога';
  g.innerHTML = list.length ? list.map(p => {
    const s = stock(p.id), n = cart[p.id] || 0;
    return '<article class="card">' + pic(p, 'pic') + '<div class="price">' + money(p.price) + '</div><div class="name">' + esc(p.name) +
      '</div><div class="unit">' + esc(p.unit) + '</div>' + (limited(p.id) && s <= 3 ? '<span class="left">Осталось ' + s + ' шт.</span>' : '') +
      (n ? '<div class="step"><button data-dec="' + esc(p.id) + '" aria-label="Меньше">−</button><span>' + n + ' шт.</span><button data-inc="' + esc(p.id) + '" aria-label="Больше">+</button></div>'
        : '<button class="add" data-inc="' + esc(p.id) + '">В корзину</button>') + '</article>';
  }).join('') : '<div class="empty" style="grid-column:1/-1">Ничего не найдено на этой точке</div>';
}

function cartLines() { return Object.keys(cart).map(id => ({ p: PRODUCTS.find(x => x.id === id), n: cart[id] })).filter(l => l.p && l.n > 0); }
function subtotal() { return cartLines().reduce((a, l) => a + l.p.price * l.n, 0); }
function renderCartBar() {
  const n = cartLines().reduce((a, l) => a + l.n, 0);
  $('cartBar').hidden = !n || loading;
  $('cartCount').textContent = 'Корзина · ' + n + ' шт.';
  $('cartSum').textContent = money(subtotal());
}
function render() { renderHeader(); renderGrid(); renderCartBar(); save(); }

// Убирает из корзины то, чего нет на выбранной точке; возвращает [убрано, уменьшено]
function cleanCart() {
  let removed = 0, cut = 0;
  Object.keys(cart).forEach(pid => {
    const s = stock(pid);
    if (!PRODUCTS.some(p => p.id === pid) || s === 0) { delete cart[pid]; removed++; }
    else if (cart[pid] > s) { cart[pid] = s; cut++; }
  });
  return [removed, cut];
}

function change(id, d) {
  const n = (cart[id] || 0) + d, s = stock(id);
  if (n > s) { toast(limited(id) ? 'На этой точке осталось только ' + s + ' шт.' : 'Не больше ' + s + ' шт. в одном заказе'); return; }
  if (n <= 0) delete cart[id]; else cart[id] = n;
  haptic();
  render();
  if (!$('ov').hidden && $('sheet').dataset.view === 'cart') openCart();
}

// ---------- Шторки ----------
function openSheet(html, view) { const s = $('sheet'); s.innerHTML = '<div class="grab"></div>' + html; s.dataset.view = view; $('ov').hidden = false; }
function closeSheet() { $('ov').hidden = true; $('sheet').dataset.view = ''; clearInterval(orderTimer); }

function openPoints() {
  openSheet('<h2>Выберите точку</h2><input id="ptq" class="in" type="search" placeholder="Название или адрес" autocomplete="off"><div id="ptList" style="margin-top:12px"></div>' +
    (LIVE ? '' : '<p class="hint">Демо: 8 точек. В рабочей версии — все точки сети, с поиском.</p>'), 'points');
  const draw = () => {
    const q = $('ptq').value.trim().toLowerCase();
    const list = POINTS.filter(p => !q || (p.name + ' ' + p.addr).toLowerCase().includes(q));
    $('ptList').innerHTML = list.slice(0, 60).map(p =>
      '<button class="pt" data-pt="' + esc(p.id) + '" aria-current="' + (p.id === pointId) + '"><span style="flex:1"><b>' + esc(p.name) + '</b><small>' +
      esc(p.addr) + (p.hours ? ' · ' + esc(p.hours) : '') + '</small><span class="tags">' +
      (p.delivery ? '<span class="tag ok">Доставка ' + esc(p.delivery.eta) + '</span>' : '<span class="tag">Только самовывоз</span>') +
      (p.count !== undefined ? '<span class="tag">' + p.count + ' товаров в наличии</span>' : '') + '</span></span></button>').join('') +
      (list.length > 60 ? '<p class="hint">Показаны первые 60 — уточните поиск</p>' : '') || '<div class="empty">Точка не найдена</div>';
  };
  $('ptq').oninput = draw;
  draw();
}

async function selectPoint(id) {
  if (busy) return;
  const prev = pointId;
  if (LIVE) {
    busy = true; loading = true; closeSheet(); pointId = id; render();
    try {
      const r = await api('stock', { point: id });
      if (!r.ok) throw new Error(r.message);
      STOCK = r.stock;
    } catch (e) { toast('Не удалось загрузить наличие. Попробуйте ещё раз.'); STOCK = {}; }
    busy = false; loading = false;
  } else { pointId = id; STOCK = DEMO.stock(id); closeSheet(); }
  const [removed, cut] = cleanCart();
  const p = point();
  if (p && !p.delivery && checkout.method === 'delivery') checkout.method = 'pickup';
  render();
  if (prev && prev !== id && (removed || cut))
    toast((removed ? 'Убрано из корзины: ' + removed + ' — нет на этой точке. ' : '') + (cut ? 'Уменьшено: ' + cut + '.' : ''));
}

function openCart() {
  const p = point(), lines = cartLines(), sub = subtotal(), d = p.delivery;
  const isDel = checkout.method === 'delivery' && d;
  const fee = isDel ? (d.freeFrom && sub >= d.freeFrom ? 0 : d.fee) : 0;
  const tooSmall = isDel && sub < d.min;
  const canContact = tg && tg.requestContact && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9');
  openSheet('<h2>Корзина</h2><div class="hint" style="margin-top:-6px">' + esc(p.name) + ', ' + esc(p.addr) + '</div>' +
    lines.map(l => '<div class="line">' + pic(l.p, 'mini') + '<div class="nm">' + esc(l.p.name) + '<small>' + esc(l.p.unit) + ' · ' + money(l.p.price) + '</small></div>' +
      '<div class="qty"><button data-dec="' + esc(l.p.id) + '" aria-label="Меньше">−</button><span>' + l.n + '</span><button data-inc="' + esc(l.p.id) + '" aria-label="Больше">+</button></div></div>').join('') +
    '<div class="seg" role="group" aria-label="Способ получения"><button data-m="pickup" aria-pressed="' + !isDel + '">Самовывоз</button><button data-m="delivery" aria-pressed="' + !!isDel + '"' + (d ? '' : ' disabled') + '>Доставка</button></div>' +
    '<div class="hint">' + (d ? (isDel ? 'Доставка ' + esc(d.eta) + ' · ' + money(d.fee) + (d.freeFrom ? ', бесплатно от ' + money(d.freeFrom) : '') + (d.min ? ' · минимальный заказ ' + money(d.min) : '')
      : 'Заберите заказ на точке, мы пришлём сообщение, когда он будет собран') : 'На этой точке нет доставки — только самовывоз') + '</div>' +
    (isDel ? '<label class="f" for="addr">Адрес доставки</label><input id="addr" class="in" placeholder="Улица, дом, квартира" value="' + esc(checkout.addr) + '">' : '') +
    '<label class="f" for="phone">Телефон</label><input id="phone" class="in" type="tel" inputmode="tel" placeholder="+992 __ ___ __ __" value="' + esc(checkout.phone) + '">' +
    (canContact ? '<button class="link" id="getPhone" style="border:0;background:none;color:var(--acc);font-weight:600;padding:8px 0;cursor:pointer">Взять номер из Telegram</button>' : '') +
    '<label class="f" for="slot">Когда</label><select id="slot" class="in">' + ['Как можно скорее', 'Сегодня 12:00–14:00', 'Сегодня 16:00–18:00', 'Сегодня 18:00–20:00', 'Завтра 10:00–12:00']
      .map(s => '<option' + (s === checkout.slot ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>' +
    '<label class="f">Оплата</label><div class="radio"><label><input type="radio" name="pay" value="cash"' + (checkout.pay === 'cash' ? ' checked' : '') + '>Наличными</label>' +
    '<label><input type="radio" name="pay" value="card"' + (checkout.pay === 'card' ? ' checked' : '') + '>Картой при получении</label></div>' +
    '<label class="f" for="cmt">Комментарий</label><input id="cmt" class="in" placeholder="Например: позвонить за 10 минут" value="' + esc(checkout.comment) + '">' +
    '<div class="sum"><div><span>Товары</span><span>' + money(sub) + '</span></div>' + (isDel ? '<div><span>Доставка</span><span>' + (fee ? money(fee) : 'бесплатно') + '</span></div>' : '') +
    '<div class="tot"><span>Итого</span><span>' + money(sub + fee) + '</span></div></div>' +
    (tooSmall ? '<div class="warn">Для доставки добавьте товаров ещё на ' + money(d.min - sub) + '</div>' : '') +
    '<button class="big" id="order"' + (tooSmall || !lines.length ? ' disabled' : '') + '>Оформить заказ</button>', 'cart');
  const keep = () => {
    if ($('addr')) checkout.addr = $('addr').value;
    checkout.phone = $('phone').value; checkout.slot = $('slot').value; checkout.comment = $('cmt').value;
    const r = document.querySelector('input[name=pay]:checked'); if (r) checkout.pay = r.value;
  };
  $('sheet').oninput = keep; $('sheet').onchange = keep;
  if ($('getPhone')) $('getPhone').onclick = () => {
    try {
      tg.requestContact((ok, ev) => {
        const ph = ok && ev && ev.responseUnsafe && ev.responseUnsafe.contact && ev.responseUnsafe.contact.phone_number;
        if (ph) { checkout.phone = (String(ph).startsWith('+') ? '' : '+') + ph; $('phone').value = checkout.phone; }
      });
    } catch (e) {}
  };
  $('order').onclick = () => placeOrder(keep, isDel, sub, fee);
}

async function placeOrder(keep, isDel, sub, fee) {
  keep();
  if (isDel && checkout.addr.trim().length < 5) return toast('Укажите адрес доставки');
  if (checkout.phone.replace(/\D/g, '').length < 9) return toast('Укажите номер телефона');
  if (busy) return;
  const p = point(), lines = cartLines(), btn = $('order');
  if (!LIVE) {
    lastOrder = { no: 1000 + DEMO.orders.length + 1, date: new Date().toLocaleDateString('ru-RU'), point: p.name, method: isDel ? 'delivery' : 'pickup',
      slot: checkout.slot, total: sub + fee, fee: fee, status: 'Новый', lines: lines.map(l => ({ name: l.p.name, qty: l.n, sum: l.p.price * l.n })) };
    DEMO.orders.unshift(lastOrder);
    cart = {}; render(); haptic('heavy'); openOrder();
    const seq = ['Собирается', isDel ? 'В пути' : 'Готов к выдаче'];
    let i = 0;
    orderTimer = setInterval(() => { if (i < seq.length) { lastOrder.status = seq[i++]; if ($('sheet').dataset.view === 'order') openOrder(true); } else clearInterval(orderTimer); }, 4000);
    return;
  }
  busy = true; btn.disabled = true; btn.textContent = 'Отправляем заказ…';
  try {
    const name = client && client.name ? client.name :
      [tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name, tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.last_name].filter(Boolean).join(' ');
    const r = await api('order', { point: pointId, items: lines.map(l => ({ id: l.p.id, qty: l.n })), method: isDel ? 'delivery' : 'pickup',
      address: checkout.addr, phone: checkout.phone, slot: checkout.slot, pay: checkout.pay, comment: checkout.comment, name: name });
    busy = false;
    if (r.stock) STOCK = r.stock;
    if (!r.ok) {
      toast(r.message || 'Не удалось оформить заказ');
      if (r.error === 'stock') { cleanCart(); render(); openCart(); }
      else { btn.disabled = false; btn.textContent = 'Оформить заказ'; }
      return;
    }
    lastOrder = r.order;
    client = Object.assign(client || {}, { phone: checkout.phone, address: checkout.addr });
    checkout.comment = '';
    cart = {}; render(); haptic('heavy'); openOrder();
    orderTimer = setInterval(refreshOrder, 20000);
  } catch (e) {
    busy = false; btn.disabled = false; btn.textContent = 'Оформить заказ';
    toast('Нет связи с магазином. Заказ не отправлен — попробуйте ещё раз.');
  }
}

async function refreshOrder() {
  if ($('sheet').dataset.view !== 'order') return clearInterval(orderTimer);
  try {
    const r = await api('myorders');
    const o = r.ok && r.orders.find(x => x.no === lastOrder.no);
    if (o && o.status !== lastOrder.status) { lastOrder.status = o.status; openOrder(true); }
  } catch (e) {}
}

function steps(o) {
  const last = o.method === 'delivery' ? 'В пути' : 'Готов к выдаче';
  return ['Новый', 'Собирается', last, 'Выполнен'];
}
const STEP_NAMES = { 'Новый': 'Заказ принят', 'Собирается': 'Собираем на точке', 'Готов к выдаче': 'Готов к выдаче', 'В пути': 'Курьер в пути', 'Выполнен': 'Выполнен' };

function openOrder(keepTimer) {
  const o = lastOrder, st = steps(o), cur = Math.max(0, st.indexOf(o.status));
  const cancelled = o.status === 'Отменён';
  const s = $('sheet');
  s.innerHTML = '<div class="grab"></div><h2>Заказ № ' + esc(o.no) + '</h2><div class="hint">' + esc(o.point) + ' · ' + (o.method === 'delivery' ? 'доставка' : 'самовывоз') + ' · ' + esc(o.slot) + '</div>' +
    (cancelled ? '<div class="warn" style="font-size:16px;margin:14px 0">Заказ отменён</div>' :
      '<div class="track">' + st.map((x, i) => '<div class="' + (i <= cur ? 'on' : '') + '"><i>' + (i < cur || (i === cur && x === 'Выполнен') ? '✓' : i + 1) + '</i>' + STEP_NAMES[x] + '</div>').join('') + '</div>') +
    '<div class="sum">' + o.lines.map(l => '<div><span>' + esc(l.name) + ' × ' + l.qty + '</span><span>' + money(l.sum) + '</span></div>').join('') +
    (o.fee ? '<div><span>Доставка</span><span>' + money(o.fee) + '</span></div>' : '') +
    '<div class="tot"><span>Итого</span><span>' + money(o.total) + '</span></div></div>' +
    '<p class="hint" style="margin-top:12px">' + (LIVE ? 'Статус обновится сам. Бот тоже пришлёт сообщение, когда заказ будет готов.' : 'Демо: статусы меняются сами. В рабочей версии их меняют сотрудники точки.') + '</p>' +
    '<button class="big ghost" id="done">Вернуться в каталог</button>';
  s.dataset.view = 'order'; $('ov').hidden = false;
  $('done').onclick = closeSheet;
}

async function openMyOrders() {
  openSheet('<h2>Мои заказы</h2><div id="myList"><div class="empty">Загрузка…</div></div>', 'orders');
  let list = [];
  if (LIVE) {
    try { const r = await api('myorders'); list = r.ok ? r.orders : []; }
    catch (e) { $('myList').innerHTML = '<div class="empty">Нет связи с магазином</div>'; return; }
  } else list = DEMO.orders.map(o => ({ no: o.no, date: o.date, point: o.point, method: o.method, total: o.total, status: o.status,
    compo: o.lines.map(l => l.name + ' × ' + l.qty).join('; ') }));
  $('myList').innerHTML = list.length ? list.map(o => '<div class="line" style="align-items:flex-start"><div class="nm"><b>№ ' + esc(o.no) + '</b> · ' + esc(o.date) +
    '<small>' + esc(o.point) + ' · ' + (o.method === 'delivery' ? 'доставка' : 'самовывоз') + '</small><small>' + esc(o.compo) + '</small></div>' +
    '<div style="text-align:right"><b style="white-space:nowrap">' + money(o.total) + '</b><br><span class="tag' + (o.status === 'Выполнен' ? ' ok' : '') + '">' + esc(o.status) + '</span></div></div>').join('')
    : '<div class="empty">Заказов пока нет</div>';
}

// ---------- События ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (e.target === $('ov')) return closeSheet();
  if (!t) return;
  if (t.dataset.inc) return change(t.dataset.inc, 1);
  if (t.dataset.dec) return change(t.dataset.dec, -1);
  if (t.dataset.c) { cat = t.dataset.c; return render(); }
  if (t.dataset.pt) return selectPoint(t.dataset.pt);
  if (t.dataset.m && !t.disabled) { checkout.method = t.dataset.m; return openCart(); }
  if (t.id === 'pointBtn') return openPoints();
  if (t.id === 'cartBtn') return openCart();
  if (t.id === 'myBtn') return openMyOrders();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) closeSheet(); });
$('q').oninput = e => { query = e.target.value; renderGrid(); };

if (LIVE) $('demoNote').remove();
if (LOGO_SRC) $('logo').src = LOGO_SRC;
boot();
}
</script>
</body>
</html>
