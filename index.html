<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Табель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f3f5fa; --card: #ffffff; --text: #1b2232; --muted: #8a93a6; --line: #e7eaf1;
    --accent: #2f6df6; --accent-soft: #eaf0ff; --ok: #1f9d55; --ok-soft: #e6f6ec;
    --bad: #d93a3a; --bad-soft: #fdecec; --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px 14px 28px; }
  .hidden { display: none !important; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 10px rgba(27, 34, 50, .05); }

  /* Шапка */
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 19px; flex: none; }
  .hello { flex: 1; min-width: 0; }
  .hello small { color: var(--muted); font-size: 13px; }
  .hello b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .round-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #f1f3f8; color: var(--text);
    display: grid; place-items: center; cursor: pointer; flex: none; }
  .round-btn svg { width: 22px; height: 22px; }

  /* Карта */
  .map-card { position: relative; height: 220px; margin-top: 12px; overflow: hidden; }
  #map { position: absolute; inset: 0; z-index: 1; background: #e9edf3; }
  .pill { position: absolute; z-index: 5; top: 12px; left: 12px; right: 12px; text-align: center;
    background: rgba(255,255,255,.94); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    box-shadow: 0 1px 6px rgba(0,0,0,.08); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { position: absolute; z-index: 5; left: 12px; bottom: 12px; cursor: pointer; border-radius: 999px; padding: 7px 12px;
    font-size: 13px; font-weight: 600; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.1); max-width: 70%; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.wait { color: var(--muted); }
  .refresh { position: absolute; z-index: 5; right: 12px; bottom: 12px; width: 56px; height: 56px;
    border-radius: 50%; border: 0; background: #fff; color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.14);
    display: grid; place-items: center; cursor: pointer; }
  .refresh svg { width: 26px; height: 26px; }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff;
    box-shadow: 0 0 0 8px rgba(47,109,246,.18); }
  .leaflet-control-attribution { font-size: 9px; }

  /* Кнопки отметки */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .act { border: 0; text-align: left; padding: 16px; min-height: 160px; display: flex; flex-direction: column;
    justify-content: space-between; cursor: pointer; color: var(--text); font: inherit; transition: transform .1s; }
  .act:active:not(:disabled) { transform: scale(.97); }
  .act:disabled { cursor: default; opacity: .5; }
  .act.done:disabled { opacity: .9; }
  .act .ico { width: 44px; height: 44px; border-radius: 50%; background: #f1f3f8; display: grid; place-items: center; }
  .act .ico svg { width: 22px; height: 22px; }
  .act.ready .ico { background: var(--accent-soft); color: var(--accent); }
  .act.done .ico { background: var(--ok-soft); color: var(--ok); }
  .act b { display: block; font-size: 17px; margin-top: 14px; }
  .act small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
  .act.done small { color: var(--ok); }
  .loader { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--accent-soft);
    border-top-color: var(--accent); animation: spin .8s linear infinite; }

  /* Комментарии */
  .sel { position: relative; }
  .sel select { width: 100%; appearance: none; -webkit-appearance: none; border: 0; border-radius: 18px;
    background: var(--card); padding: 14px 34px 14px 16px; font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--text); box-shadow: 0 1px 10px rgba(27,34,50,.05); }
  .sel select:disabled { color: var(--muted); }
  .sel::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; margin-top: -6px;
    border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
  .sel.need select { box-shadow: 0 0 0 2px var(--bad); }
  .other { width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px;
    font: inherit; background: #fff; }

  .wide-btn { width: 100%; margin-top: 14px; padding: 16px; border-radius: 18px; border: 1px solid #c9d8fd;
    background: linear-gradient(#f2f6ff, #e6edff); color: #1d3f9a; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; }
  .today { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }

  /* Регистрация и формы */
  .form { padding: 20px; margin-top: 12px; }
  .form h2 { margin: 0 0 4px; font-size: 20px; }
  .form p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .input { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font: inherit;
    background: #fff; color: var(--text); }
  .primary { width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 16px; background: var(--accent);
    color: #fff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .6; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Нижняя шторка */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15, 20, 35, .4); display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-width: 480px; margin: 0 auto; max-height: 86vh; overflow: auto; background: var(--bg);
    border-radius: 24px 24px 0 0; padding: 10px 14px 24px; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #cfd4df; margin: 0 auto 10px; }
  .sheet h3 { margin: 6px 4px 12px; font-size: 18px; }
  .sheet h4 { margin: 18px 4px 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px;
    background: var(--card); margin-bottom: 8px; }
  .item .d { font-weight: 700; }
  .item .t { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item .h { font-weight: 700; white-space: nowrap; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--bad-soft); color: var(--bad); margin-left: 6px; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.wait { background: #fff4dd; color: #a36a00; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }

  .toast { position: fixed; z-index: 100; left: 14px; right: 14px; bottom: 20px; max-width: 452px; margin: 0 auto;
    padding: 14px 16px; border-radius: 16px; color: #fff; background: #1b2232; font-weight: 600;
    box-shadow: 0 6px 24px rgba(0,0,0,.2); transition: opacity .2s, transform .2s; }
  .toast.ok { background: var(--ok); } .toast.err { background: var(--bad); }
  .toast.off { opacity: 0; transform: translateY(12px); pointer-events: none; }

  /* Супервайзер и инкассация */
  .box { padding: 16px; margin-top: 12px; }
  .box-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .box-h b { font-size: 16px; }
  .link { border: 0; background: none; color: var(--accent); font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; padding: 4px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .rp { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .rp:first-child { border-top: 0; }
  .rp .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; background: #eef0f5; color: var(--muted); }
  .rp .dot.v { background: var(--ok-soft); color: var(--ok); }
  .rp .dot.now { background: var(--accent); color: #fff; }
  .rp .nm { flex: 1; min-width: 0; font-weight: 600; }
  .rp .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .rp .sum { font-weight: 700; white-space: nowrap; font-size: 14px; }
  .here { font-size: 18px; font-weight: 700; }
  .ink-row { display: flex; gap: 8px; margin-top: 12px; }
  .ink-row .input { flex: 1; }
  .btn2 { border: 0; border-radius: 14px; padding: 0 16px; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn2.ghost { background: #eef1f7; color: var(--text); }
  .btn2:disabled { opacity: .6; }
  .full { width: 100%; padding: 15px; margin-top: 12px; }
  .pend { padding: 16px; margin-top: 12px; border: 2px solid #ffcf66; }
  .pend .amt { font-size: 22px; font-weight: 800; margin: 4px 0 2px; }
  .pend .row2 { margin-top: 12px; }
  .chk { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card);
    border-radius: 14px; margin-bottom: 8px; cursor: pointer; }
  .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
  .chk span { flex: 1; font-weight: 600; }
  .chk small { color: var(--muted); }
  .sheet-foot { position: sticky; bottom: -24px; background: var(--bg); padding: 8px 0 4px; }

  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Загрузка / ошибка -->
  <div id="vLoading" class="center"><div><div class="loader" style="margin:0 auto 12px"></div>Загрузка…</div></div>

  <!-- Регистрация -->
  <div id="vReg" class="hidden">
    <div class="card form">
      <h2>Регистрация</h2>
      <p>Один раз укажите свои данные и рабочее место.</p>
      <label for="regName">Фамилия и имя</label>
      <input id="regName" class="input" autocomplete="name" placeholder="Например: Иванов Иван">
      <label for="regPoint">Рабочее место</label>
      <div class="sel"><select id="regPoint"></select></div>
      <button id="regBtn" class="primary">Готово</button>
    </div>
  </div>

  <!-- Главный экран -->
  <div id="vMain" class="hidden">
    <div class="card head">
      <div class="avatar" id="avatar">?</div>
      <div class="hello"><small>Добро пожаловать</small><b id="userName"></b></div>
      <button class="round-btn" id="histBtn" aria-label="История">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      </button>
    </div>

    <div id="pendingBox"></div>

    <div class="card map-card">
      <div id="map"></div>
      <div class="pill" id="pointName"></div>
      <div class="status wait" id="geoStatus">Определяем местоположение…</div>
      <button class="refresh" id="refreshBtn" aria-label="Обновить местоположение">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>

    <div class="grid">
      <button class="card act" id="btnIn">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        <span><b id="inTitle">Начать работу</b><small id="inSub">Нажмите для отметки</small></span>
      </button>
      <button class="card act" id="btnOut">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        <span><b id="outTitle">Завершить работу</b><small id="outSub">Сначала начните</small></span>
      </button>
    </div>

    <div class="grid" style="margin-top:12px">
      <div>
        <div class="sel" id="selInWrap"><select id="commentIn"></select></div>
        <input id="otherIn" class="other hidden" placeholder="Ваш комментарий" maxlength="300">
      </div>
      <div>
        <div class="sel" id="selOutWrap"><select id="commentOut"></select></div>
        <input id="otherOut" class="other hidden" placeholder="Причина ухода" maxlength="300">
      </div>
    </div>

    <div id="supBox" class="hidden">
      <div class="card box">
        <div class="box-h"><b>Сейчас</b></div>
        <div id="visitBody"></div>
      </div>
      <div class="card box">
        <div class="box-h"><b>Маршрут на сегодня</b><button class="link" id="routeEdit">Составить</button></div>
        <div id="routeBody"></div>
      </div>
    </div>

    <button class="wide-btn" id="leaveBtn">Отпрашивание</button>
    <div class="today" id="todayInfo"></div>
    <div class="today" style="font-size:11px;margin-top:6px;opacity:.6">версия <span id="ver"></span></div>
  </div>
</div>

<!-- Маршрут супервайзера -->
<div class="overlay hidden" id="routeSheet">
  <div class="sheet">
    <div class="grab"></div>
    <h3>Маршрут на сегодня</h3>
    <p class="muted" style="margin:0 4px 12px">Отметьте точки, которые посетите сегодня. Руководитель получит уведомление.</p>
    <div id="routeChoices"></div>
    <div class="sheet-foot"><button class="primary" id="routeSend" style="margin-top:6px">Отправить маршрут</button></div>
  </div>
</div>

<!-- История -->
<div class="overlay hidden" id="histSheet">
  <div class="sheet">
    <div class="grab"></div>
    <h3>Мои отметки</h3>
    <div id="histList"><div class="empty">Загрузка…</div></div>
  </div>
</div>

<!-- Отпрашивание -->
<div class="overlay hidden" id="leaveSheet">
  <div class="sheet">
    <div class="grab"></div>
    <h3>Отпрашивание</h3>
    <div class="card form" style="margin-top:0">
      <div class="row2">
        <div><label for="lvFrom">С</label><input type="date" id="lvFrom" class="input"></div>
        <div><label for="lvTo">По</label><input type="date" id="lvTo" class="input"></div>
      </div>
      <label for="lvReason">Причина</label>
      <div class="sel"><select id="lvReason">
        <option>Семейные обстоятельства</option>
        <option>Болезнь</option>
        <option>Отпуск за свой счёт</option>
        <option>Учёба</option>
        <option value="other">Другое…</option>
      </select></div>
      <input id="lvOther" class="other hidden" placeholder="Опишите причину" maxlength="300">
      <button id="lvSend" class="primary">Отправить руководителю</button>
    </div>
  </div>
</div>

<div class="toast off" id="toast"></div>

<script>
// ===== НАСТРОЙКА: адрес веб-приложения Apps Script (заканчивается на /exec) =====
const API_URL = 'ВСТАВЬТЕ_URL_ВЕБ-ПРИЛОЖЕНИЯ';
// ================================================================================

const COMMENTS_IN = ['Без комментария', 'Опоздание: транспорт', 'Опоздание: личные причины',
  'Был на выезде по работе', 'Другое…'];
const COMMENTS_OUT = ['Без комментария', 'По личным делам', 'По болезни', 'По заданию руководителя',
  'Выезд по работе', 'Другое…'];

const tg = window.Telegram && window.Telegram.WebApp;
const $ = id => document.getElementById(id);
let state = null, pos = null, busy = false;
let map = null, meMarker = null, accCircle = null, pointLayer = null, refining = false;
const GOOD_ACC = 25;  // точность, при которой перестаём уточнять, метров
const APP_VERSION = '6';
let refreshing = false, lastRefresh = 0;

// ---------- Запуск ----------
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#f3f5fa'); tg.setBackgroundColor('#f3f5fa'); } catch (e) {}
}
$('ver').textContent = APP_VERSION;
fillSelect($('commentIn'), COMMENTS_IN);
fillSelect($('commentOut'), COMMENTS_OUT);
start();

async function start() {
  if (!tg || !tg.initData) return fatal('Откройте табель через бота в Telegram.');
  try {
    const r = await api('init');
    if (!r.ok) return fatal(r.message || 'Нет доступа');
    applyState(r);
  } catch (e) {
    fatal('Нет связи с сервером. Проверьте интернет и откройте табель заново.');
  }
}

function fatal(text) { $('vLoading').innerHTML = '<div>' + esc(text) + '</div>'; show('vLoading'); }
function show(id) { ['vLoading', 'vReg', 'vMain'].forEach(v => $(v).classList.toggle('hidden', v !== id)); }

// ---------- Связь с сервером ----------
async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',  // text/plain: без предварительного CORS-запроса
    body: JSON.stringify(Object.assign({ action: action, initData: tg ? tg.initData : '' }, data || {}))
  });
  return res.json();
}

// ---------- Состояние ----------
function applyState(r) {
  state = r;
  if (!r.registered) return showReg(r);
  show('vMain');
  $('userName').textContent = r.user.name;
  $('avatar').textContent = (r.user.name.trim()[0] || '?').toUpperCase();
  const sup = isSup();
  $('supBox').classList.toggle('hidden', !sup);
  $('inTitle').textContent = sup ? 'Начать день' : 'Начать работу';
  $('outTitle').textContent = sup ? 'Завершить день' : 'Завершить работу';
  renderPending();
  renderSup();
  renderButtons();
  initMap();
  drawPoints();
  updatePill();
  if (!pos) refreshLocation();
  else renderDistance();
}

function showReg(r) {
  show('vReg');
  $('regName').value = $('regName').value || r.suggestedName || '';
  const sel = $('regPoint');
  sel.innerHTML = '<option value="">— выберите —</option>' +
    r.points.map(p => '<option>' + esc(p) + '</option>').join('');
  if (!r.points.length) toast('Рабочие места ещё не настроены. Обратитесь к администратору.', 'err');
}

$('regBtn').onclick = async () => {
  const name = $('regName').value.trim(), point = $('regPoint').value;
  if (name.length < 3) return toast('Введите фамилию и имя', 'err');
  if (!point) return toast('Выберите рабочее место', 'err');
  $('regBtn').disabled = true;
  try {
    const r = await api('register', { name: name, point: point });
    if (!r.ok) return toast(r.message, 'err');
    haptic('success');
    applyState(r);
  } catch (e) { toast('Нет связи с сервером', 'err'); }
  finally { $('regBtn').disabled = false; }
};

function renderButtons() {
  const s = state.shift, inB = $('btnIn'), outB = $('btnOut');
  inB.className = 'card act'; outB.className = 'card act';
  if (s.open) {
    inB.disabled = true; inB.classList.add('done'); $('inSub').textContent = 'Отмечено в ' + s.inTime;
    outB.disabled = false; outB.classList.add('ready'); $('outSub').textContent = 'Нажмите для отметки';
  } else if (s.closedToday) {
    inB.disabled = true; inB.classList.add('done'); $('inSub').textContent = 'Отмечено в ' + s.inToday;
    outB.disabled = true; outB.classList.add('done'); $('outSub').textContent = 'Отмечено в ' + s.outTime;
  } else {
    inB.disabled = false; inB.classList.add('ready'); $('inSub').textContent = 'Нажмите для отметки';
    outB.disabled = true; $('outSub').textContent = 'Сначала начните';
  }
  $('commentIn').disabled = inB.disabled;
  $('commentOut').disabled = outB.disabled;
  if (inB.disabled) $('otherIn').classList.add('hidden');
  if (outB.disabled) $('otherOut').classList.add('hidden');

  const tp = targetPoint();
  const end = tp ? tp.end : '';
  $('todayInfo').textContent = s.closedToday ? (isSup() ? 'День завершён. Хорошего отдыха!' :
    'Смена на сегодня закрыта. Хорошего отдыха!') : (end && !isSup() ? 'Рабочий день до ' + end : '');
  updateNearest();
}

function isSup() { return !!(state && state.user && state.user.role === 'sup'); }

// ---------- Карта и геолокация ----------
// Точка, к которой сейчас идёт отметка:
// при открытой смене — точка прихода, иначе ближайшая из доступных
function targetPoint() {
  const pts = state.points || [];
  if (isSup() && state.openVisit) return pts.find(p => p.name === state.openVisit.point) || null;
  if (state.shiftPoint) return pts.find(p => p.name === state.shiftPoint) || null;
  if (!pts.length) return null;
  if (!pos) return pts.find(p => p.name === state.user.point) || pts[0];
  return pts.slice().sort((a, b) => distance(pos.lat, pos.lon, a.lat, a.lon) - distance(pos.lat, pos.lon, b.lat, b.lon))[0];
}

function updatePill() {
  const tp = targetPoint(), pts = state.points || [];
  let t;
  if (!pts.length) t = 'Точки не настроены';
  else if (!tp) t = state.shiftPoint + ' — точка не найдена';
  else if (isSup() && state.openVisit) t = tp.name + ' · вы на точке';
  else if (state.shiftPoint) t = tp.name + ' · смена открыта здесь';
  else if (pts.length > 1 && pos) t = tp.name + ' · ближайшая';
  else t = tp.name;
  $('pointName').textContent = t;
}

function initMap() {
  if (map || !window.L) return;
  const tp = targetPoint();
  const center = tp ? [tp.lat, tp.lon] : [38.56, 68.78];
  map = L.map('map', { zoomControl: false, attributionControl: true }).setView(center, 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
}

function drawPoints() {
  if (!map) return;
  if (pointLayer) pointLayer.remove();
  pointLayer = L.layerGroup().addTo(map);
  const tp = targetPoint();
  (state.points || []).forEach(p => {
    const main = tp && p.name === tp.name;
    L.circle([p.lat, p.lon], { radius: p.radius, color: main ? '#2f6df6' : '#9aa3b5', weight: 1,
      fillOpacity: main ? .1 : .05 }).addTo(pointLayer);
    L.circleMarker([p.lat, p.lon], { radius: 5, color: main ? '#7a3cf0' : '#9aa3b5', fillOpacity: 1 })
      .bindTooltip(p.name).addTo(pointLayer);
  });
}

// Сначала GPS телефона (несколько секунд уточняем и берём самую точную отметку),
// если не получилось — геолокация через Telegram
function getLocation(onProgress) {
  return browserLocation(onProgress).catch(e => telegramLocation().catch(() => { throw e; }));
}

function browserLocation(onProgress) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('Геолокация недоступна на этом устройстве'));
    let best = null, finished = false, id = null;
    const end = () => { finished = true; if (id !== null) navigator.geolocation.clearWatch(id); clearTimeout(t); };
    const t = setTimeout(() => {
      if (finished) return;
      end();
      best ? resolve(best) : reject(new Error('Не удалось определить местоположение. Включите GPS.'));
    }, 15000);
    id = navigator.geolocation.watchPosition(p => {
      if (finished) return;
      if (p.timestamp && Date.now() - p.timestamp > 20000) return;  // старая (кэшированная) отметка — пропускаем
      const c = { lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy || 9999),
        src: 'GPS телефона', time: Date.now() };
      if (!best || c.acc < best.acc) { best = c; if (onProgress) onProgress(best); }
      if (best.acc <= GOOD_ACC) { end(); resolve(best); }
    }, e => {
      if (finished) return;
      if (best) { end(); return resolve(best); }
      if (e.code === 3) return;  // ждём общий таймер
      end();
      reject(new Error(e.code === 1 ? 'Нет доступа к геолокации. Разрешите Telegram доступ к местоположению.'
        : 'Не удалось определить местоположение. Включите GPS.'));
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  });
}

function telegramLocation() {
  return new Promise((resolve, reject) => {
    const LM = tg && tg.LocationManager;
    if (!LM || !tg.isVersionAtLeast || !tg.isVersionAtLeast('8.0')) return reject(new Error('нет'));
    const go = () => {
      if (!LM.isLocationAvailable) return reject(new Error('нет'));
      LM.getLocation(d => {
        if (d) return resolve({ lat: d.latitude, lon: d.longitude, acc: Math.round(d.horizontal_accuracy || 0),
          src: 'Telegram', time: Date.now() });
        if (LM.isAccessRequested && !LM.isAccessGranted) {
          tg.showConfirm('Нет доступа к геолокации. Открыть настройки, чтобы разрешить?', ok => {
            if (ok) LM.openSettings();
          });
        }
        reject(new Error('нет'));
      });
    };
    LM.isInited ? go() : LM.init(go);
  });
}

async function refreshLocation() {
  if (refreshing) return refreshing;
  refreshing = doRefresh().finally(() => { refreshing = false; lastRefresh = Date.now(); });
  return refreshing;
}

async function doRefresh() {
  const btn = $('refreshBtn');
  btn.classList.add('spin');
  setStatus('wait', 'Определяем местоположение…');
  refining = true;
  try {
    pos = await getLocation(c => { pos = c; renderDistance(); });
    refining = false;
    renderDistance();
    return pos;
  } catch (e) {
    setStatus('bad', e.message);
    throw e;
  } finally {
    refining = false;
    btn.classList.remove('spin');
  }
}

function renderDistance() {
  if (!pos) return;
  const ll = [pos.lat, pos.lon], p = targetPoint();
  updatePill();
  drawPoints();
  renderButtons();
  if (map) {  // карта может не загрузиться при плохом интернете — отметка работает и без неё
    const icon = L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    if (meMarker) meMarker.setLatLng(ll); else meMarker = L.marker(ll, { icon: icon }).addTo(map);
    if (accCircle) accCircle.setLatLng(ll).setRadius(pos.acc);
    else accCircle = L.circle(ll, { radius: pos.acc, color: '#2f6df6', weight: 0, fillOpacity: .12 }).addTo(map);
  }
  if (!p) { if (map) map.setView(ll, 17); return setStatus('bad', 'Нет доступных точек'); }
  const d = Math.round(distance(pos.lat, pos.lon, p.lat, p.lon));
  const accTxt = ' (±' + pos.acc + ' м)' + (refining ? ' · уточняем…' : '');
  if (d <= p.radius) {
    setStatus('ok', '● На месте · ' + fmtDist(d) + accTxt);
    if (map) map.setView([p.lat, p.lon], 17);
  } else {
    if (isSup()) setStatus('wait', 'До ближайшей точки ' + fmtDist(d) + accTxt);
    else setStatus(refining ? 'wait' : 'bad', '● Вне точки · ' + fmtDist(d) + accTxt);
    if (map) map.fitBounds(L.latLngBounds([ll, [p.lat, p.lon]]), { padding: [40, 40], maxZoom: 17 });
  }
  if (pos.acc > 100) setStatus(refining ? 'wait' : 'bad', 'Низкая точность ±' + fmtDist(pos.acc) +
    (refining ? ' · уточняем…' : ' · включите точную геолокацию'));
}

function setStatus(kind, text) { const s = $('geoStatus'); s.className = 'status ' + kind; s.textContent = text; }

$('refreshBtn').onclick = () => refreshLocation().catch(() => {});

// Обновляем местоположение, когда приложение снова открыли, и раз в минуту, пока оно на экране
function autoRefresh() {
  if (!state || !state.registered || busy || document.hidden) return;
  if (Date.now() - lastRefresh < 10000) return;
  refreshLocation().catch(() => {});
  const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  const sheetOpen = document.querySelector('.overlay:not(.hidden)');
  if (!typing && !sheetOpen) api('init').then(r => { if (r.ok && !busy) applyState(r); }).catch(() => {});
}
document.addEventListener('visibilitychange', autoRefresh);
if (tg && tg.onEvent) tg.onEvent('activated', autoRefresh);
setInterval(autoRefresh, 60000);
$('geoStatus').onclick = () => {
  if (!pos) return;
  toast('Ваши координаты: ' + pos.lat.toFixed(6) + ', ' + pos.lon.toFixed(6) + ' (±' + pos.acc + ' м, ' + pos.src + ')');
};

$('btnIn').onclick = () => markAction('in');
$('btnOut').onclick = () => {
  const now = new Date().toTimeString().slice(0, 5);
  if (tg && tg.showConfirm) tg.showConfirm('Завершить рабочий день в ' + now + '?', ok => { if (ok) markAction('out'); });
  else markAction('out');
};

async function markAction(kind) {
  if (busy) return;
  const comment = commentValue(kind);
  if (comment === null) return toast('Напишите комментарий', 'err');
  busy = true;
  const btn = kind === 'in' ? $('btnIn') : $('btnOut');
  const ico = btn.querySelector('.ico'), icoHtml = ico.innerHTML;
  ico.innerHTML = '<div class="loader"></div>';
  try {
    const loc = await refreshLocation();  // всегда свежие координаты в момент отметки
    const r = await api(kind === 'in' ? 'checkin' : 'checkout',
      { lat: loc.lat, lon: loc.lon, acc: loc.acc, comment: comment });
    if (r.ok) {
      haptic('success');
      toast(r.message, 'ok');
      resetComment(kind);
      applyState(r);
    } else {
      haptic('error');
      toast(r.message || 'Ошибка', 'err');
      if (r.error === 'need_comment') {
        $('selOutWrap').classList.add('need');
        $('commentOut').focus();
      }
    }
  } catch (e) {
    haptic('error');
    if (e && e.message && !/fetch/i.test(e.message)) toast(e.message, 'err');
    else toast('Нет связи с сервером. Попробуйте ещё раз.', 'err');
  } finally {
    ico.innerHTML = icoHtml;
    busy = false;
  }
}

// ---------- Супервайзер: визиты, инкассация, маршрут ----------
function money(n) { return Number(n).toLocaleString('ru-RU') + ' сом.'; }
const ST_ICON = { 'Подтверждено': '<span class="tag ok">подтверждено</span>',
  'Расхождение': '<span class="tag">расхождение</span>', 'Ожидает': '<span class="tag wait">ждёт продавца</span>' };

function renderSup() {
  if (!isSup()) return;
  const st = state, vb = $('visitBody');
  if (!st.shift.open) {
    vb.innerHTML = '<div class="muted">' + (st.shift.closedToday ? 'День завершён.' :
      'Нажмите «Начать день», чтобы отмечаться на точках.') + '</div>';
  } else if (!st.openVisit) {
    vb.innerHTML = '<div class="muted" id="nearestTxt">Определяем ближайшую точку…</div>' +
      '<button class="btn2 full" id="visitStartBtn">📍 Я на точке</button>';
    $('visitStartBtn').onclick = visitStart;
  } else {
    const v = st.openVisit;
    const inks = (st.inks || []).filter(i => i.point === v.point);
    vb.innerHTML = '<div class="here">' + esc(v.point) + '</div><div class="muted">на точке с ' + esc(v.in) +
      (v.inRoute ? '' : ' · <span class="tag wait">вне маршрута</span>') + '</div>' +
      inks.map(i => '<div class="rp"><div class="nm">' + money(i.amount) + '<small>' + esc(i.time) +
        (i.status === 'Расхождение' && i.sellerAmount !== null ? ' · продавец: ' + money(i.sellerAmount) : '') +
        '</small></div>' + (ST_ICON[i.status] || '') + '</div>').join('') +
      '<div class="ink-row"><input id="inkAmount" class="input" inputmode="decimal" placeholder="Сумма инкассации, сом.">' +
      '<button class="btn2" id="inkBtn">Записать</button></div>' +
      '<button class="btn2 ghost full" id="visitEndBtn">Ухожу с точки</button>';
    $('inkBtn').onclick = inkCreate;
    $('visitEndBtn').onclick = visitEnd;
  }

  const route = st.route, visits = st.visits || [];
  $('routeEdit').textContent = route ? 'Изменить' : 'Составить';
  $('routeEdit').classList.toggle('hidden', st.shift.closedToday);
  const visited = {}, sums = {};
  visits.forEach(v => { visited[v.point] = true; });
  (st.inks || []).forEach(i => { sums[i.point] = (sums[i.point] || 0) + i.amount; });
  const nowAt = st.openVisit ? st.openVisit.point : '';
  const names = (route || []).concat(Object.keys(visited).filter(p => !route || route.indexOf(p) < 0));
  if (!names.length) {
    $('routeBody').innerHTML = '<div class="muted">Маршрут не составлен. Нажмите «Составить» и отметьте точки на сегодня.</div>';
  } else {
    const done = (route || []).filter(p => visited[p]).length;
    const total = Object.values(sums).reduce((a, b) => a + b, 0);
    $('routeBody').innerHTML = names.map((p, i) => {
      const off = !route || route.indexOf(p) < 0;
      const cls = p === nowAt ? 'now' : visited[p] ? 'v' : '';
      const ico = p === nowAt ? '●' : visited[p] ? '✓' : (i + 1);
      const vs = visits.filter(v => v.point === p).map(v => v.in + (v.out ? '–' + v.out : '')).join(', ');
      return '<div class="rp"><div class="dot ' + cls + '">' + ico + '</div><div class="nm">' + esc(p) +
        (off ? ' <span class="tag wait">вне маршрута</span>' : '') + '<small>' + (vs || 'не посещена') +
        '</small></div><div class="sum">' + (sums[p] ? money(sums[p]) : '') + '</div></div>';
    }).join('') + '<div class="muted" style="margin-top:8px">Посещено ' + done + ' из ' + (route || []).length +
      (total ? ' · инкассировано ' + money(total) : '') + '</div>';
  }
  updateNearest();
}

function updateNearest() {
  const el = $('nearestTxt');
  if (!el) return;
  if (!pos || !(state.points || []).length) return;
  const p = targetPoint(), d = Math.round(distance(pos.lat, pos.lon, p.lat, p.lon));
  el.innerHTML = d <= p.radius ? 'Вы у точки <b>' + esc(p.name) + '</b> · ' + fmtDist(d) :
    'Ближайшая точка: ' + esc(p.name) + ' · ' + fmtDist(d);
}

async function supAction(action, data, btn) {
  if (busy) return;
  busy = true;
  if (btn) btn.disabled = true;
  try {
    const r = await api(action, data);
    if (r.ok) { haptic('success'); toast(r.message, 'ok'); applyState(r); return true; }
    haptic('error'); toast(r.message || 'Ошибка', 'err');
  } catch (e) {
    toast(e && e.message && !/fetch/i.test(e.message) ? e.message : 'Нет связи с сервером', 'err');
  } finally {
    busy = false;
    if (btn && document.body.contains(btn)) btn.disabled = false;
  }
  return false;
}

async function visitStart() {
  const btn = $('visitStartBtn');
  btn.disabled = true; btn.textContent = 'Определяем местоположение…';
  try {
    const loc = await refreshLocation();
    await supAction('visitstart', { lat: loc.lat, lon: loc.lon, acc: loc.acc }, btn);
  } catch (e) { toast(e.message || 'Не удалось определить местоположение', 'err'); }
  finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = '📍 Я на точке'; } }
}

function inkCreate() {
  const v = $('inkAmount').value.replace(/\s/g, '').replace(',', '.');
  const n = Number(v);
  if (!v || !isFinite(n) || n <= 0) return toast('Введите сумму', 'err');
  const go = () => supAction('ink', { amount: n }, $('inkBtn'));
  if (tg && tg.showConfirm) tg.showConfirm('Записать инкассацию ' + money(n) + ' на «' + state.openVisit.point + '»?',
    ok => { if (ok) go(); });
  else go();
}

function visitEnd() {
  const go = () => supAction('visitend', {}, $('visitEndBtn'));
  if (tg && tg.showConfirm) tg.showConfirm('Отметить уход с «' + state.openVisit.point + '»?', ok => { if (ok) go(); });
  else go();
}

$('routeEdit').onclick = () => {
  const chosen = {};
  (state.route || []).forEach(p => chosen[p] = true);
  const pts = (state.points || []).slice();
  if (pos) pts.sort((a, b) => distance(pos.lat, pos.lon, a.lat, a.lon) - distance(pos.lat, pos.lon, b.lat, b.lon));
  $('routeChoices').innerHTML = pts.map(p => '<label class="chk"><input type="checkbox" value="' + esc(p.name) + '"' +
    (chosen[p.name] ? ' checked' : '') + '><span>' + esc(p.name) + '</span><small>' +
    (pos ? fmtDist(Math.round(distance(pos.lat, pos.lon, p.lat, p.lon))) : '') + '</small></label>').join('') ||
    '<div class="empty">За вами не закреплено точек</div>';
  const upd = () => {
    const n = document.querySelectorAll('#routeChoices input:checked').length;
    $('routeSend').textContent = n ? 'Отправить маршрут (' + n + ')' : 'Отметьте точки';
    $('routeSend').disabled = !n;
  };
  document.querySelectorAll('#routeChoices input').forEach(i => i.onchange = upd);
  upd();
  openSheet('routeSheet');
};
$('routeSend').onclick = async () => {
  const list = Array.from(document.querySelectorAll('#routeChoices input:checked')).map(i => i.value);
  if (await supAction('route', { points: list }, $('routeSend'))) closeSheets();
};

// ---------- Продавец: подтверждение инкассации ----------
function renderPending() {
  const list = (!isSup() && state.pendingInks) || [];
  $('pendingBox').innerHTML = list.map(i =>
    '<div class="card pend" data-id="' + esc(i.id) + '"><div class="muted">💰 Инкассация · ' + esc(i.point) + ' · ' +
    esc(i.time) + '</div><div class="amt">' + money(i.amount) + '</div><div class="muted">Забрал супервайзер ' +
    esc(i.sup) + '. Подтвердите сумму, которую вы передали.</div>' +
    '<div class="row2"><button class="btn2 full" style="margin:0" data-ok="1">Подтверждаю</button>' +
    '<button class="btn2 ghost full" style="margin:0" data-ok="0">Сумма другая</button></div>' +
    '<div class="ink-row hidden"><input class="input" inputmode="decimal" placeholder="Сколько вы передали, сом.">' +
    '<button class="btn2" data-send="1">Отправить</button></div></div>').join('');
  document.querySelectorAll('#pendingBox .pend').forEach(card => {
    const id = card.dataset.id;
    card.querySelector('[data-ok="1"]').onclick = e => supAction('inkconfirm', { id: id, ok: true }, e.target);
    card.querySelector('[data-ok="0"]').onclick = () => {
      card.querySelector('.ink-row').classList.remove('hidden');
      card.querySelector('.ink-row input').focus();
    };
    card.querySelector('[data-send="1"]').onclick = e => {
      const v = card.querySelector('.ink-row input').value.replace(/\s/g, '').replace(',', '.');
      if (!v || !isFinite(Number(v))) return toast('Введите сумму', 'err');
      supAction('inkconfirm', { id: id, ok: false, amount: Number(v) }, e.target);
    };
  });
}

// ---------- Комментарии ----------
function fillSelect(sel, list) { sel.innerHTML = list.map(t => '<option>' + esc(t) + '</option>').join(''); }
$('commentIn').onchange = () => $('otherIn').classList.toggle('hidden', $('commentIn').value !== 'Другое…');
$('commentOut').onchange = () => {
  $('selOutWrap').classList.remove('need');
  $('otherOut').classList.toggle('hidden', $('commentOut').value !== 'Другое…');
};
function commentValue(kind) {
  const sel = kind === 'in' ? $('commentIn') : $('commentOut');
  const other = kind === 'in' ? $('otherIn') : $('otherOut');
  if (sel.selectedIndex === 0) return '';
  if (sel.value === 'Другое…') return other.value.trim() || null;
  return sel.value;
}
function resetComment(kind) {
  const sel = kind === 'in' ? $('commentIn') : $('commentOut');
  sel.selectedIndex = 0; sel.onchange();
  (kind === 'in' ? $('otherIn') : $('otherOut')).value = '';
}

// ---------- История ----------
$('histBtn').onclick = async () => {
  openSheet('histSheet');
  $('histList').innerHTML = '<div class="empty">Загрузка…</div>';
  try {
    const r = await api('history');
    if (!r.ok) throw new Error(r.message);
    let html = '';
    if (r.leaves && r.leaves.length) {
      html += '<h4>Отпрашивания</h4>' + r.leaves.map(l => {
        const cls = /одобр|соглас/i.test(l.status) ? 'ok' : /отказ|отклон/i.test(l.status) ? '' : 'wait';
        return '<div class="item"><div><div class="d">' + esc(l.from === l.to ? l.from : l.from + ' — ' + l.to) +
          '</div><div class="t">' + esc(l.reason) + '</div></div><div><span class="tag ' + cls + '">' +
          esc(l.status) + '</span></div></div>';
      }).join('') + '<h4>Смены</h4>';
    }
    html += r.items.length ? r.items.map(i => {
      const notes = [i.commentIn, i.commentOut].filter(Boolean).join(' · ');
      return '<div class="item"><div><div class="d">' + esc(i.date) + (i.early ? '<span class="tag">ранний уход</span>' : '') +
        '</div><div class="t">' + esc(i.point) + ' · ' + esc(i.in) + ' – ' + esc(i.out || '…') + (notes ? ' · ' + esc(notes) : '') +
        '</div></div><div class="h">' + (i.hours !== null ? fmtHours(i.hours) : '—') + '</div></div>';
    }).join('') : '<div class="empty">Отметок пока нет</div>';
    $('histList').innerHTML = html;
  } catch (e) {
    $('histList').innerHTML = '<div class="empty">Не удалось загрузить историю</div>';
  }
};

// ---------- Отпрашивание ----------
$('leaveBtn').onclick = () => {
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (!$('lvFrom').value) $('lvFrom').value = today;
  if (!$('lvTo').value) $('lvTo').value = today;
  openSheet('leaveSheet');
};
$('lvReason').onchange = () => $('lvOther').classList.toggle('hidden', $('lvReason').value !== 'other');
$('lvSend').onclick = async () => {
  const reason = $('lvReason').value === 'other' ? $('lvOther').value.trim() : $('lvReason').value;
  if (!reason) return toast('Укажите причину', 'err');
  if ($('lvTo').value < $('lvFrom').value) return toast('Дата «по» раньше даты «с»', 'err');
  $('lvSend').disabled = true;
  try {
    const r = await api('leave', { from: $('lvFrom').value, to: $('lvTo').value, reason: reason });
    if (!r.ok) return toast(r.message, 'err');
    haptic('success');
    toast(r.message, 'ok');
    closeSheets();
    $('lvOther').value = '';
  } catch (e) { toast('Нет связи с сервером', 'err'); }
  finally { $('lvSend').disabled = false; }
};

// ---------- Шторки, уведомления, утилиты ----------
function openSheet(id) {
  $(id).classList.remove('hidden');
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheets); }
}
function closeSheets() {
  ['histSheet', 'leaveSheet', 'routeSheet'].forEach(id => $(id).classList.add('hidden'));
  if (tg && tg.BackButton) { tg.BackButton.offClick(closeSheets); tg.BackButton.hide(); }
}
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeSheets(); }));

let toastTimer;
function toast(text, kind) {
  const t = $('toast');
  t.textContent = text; t.className = 'toast ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('off'), 3800);
}
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' км' : m + ' м'; }
function fmtHours(h) { const m = Math.round(h * 60); return Math.floor(m / 60) + ' ч ' + String(m % 60).padStart(2, '0') + ' м'; }
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
